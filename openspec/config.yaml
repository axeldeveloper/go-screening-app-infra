schema: spec-driven
githubCopilot:
  cloudAgent: true

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Princípios de governança do projeto. Fonte de verdade: CONSTITUTION.md na raiz; resumo em openspec/constitution.md. Consulte o arquivo da raiz para a redação completa.
  1. Arquitetura em camadas: config → db → repository → service → handler/web, com cmd/api como raiz de composição. Dependências apontam para a camada imediatamente inferior; regras de negócio ficam no service, acesso a dados no repository, handler apenas adapta HTTP.
  2. Fronteiras de responsabilidade: uma responsabilidade por pacote em internal/; serviços dependem de interfaces (ex.: repository.ItemRepository).
  3. Qualidade e testes: gofmt, go vet, golangci-lint, erros com %w, context.Context propagado, testes table-driven; make test executa go test -race ./...
  4. Segurança: limitar e validar entradas HTTP, não expor erros internos ao cliente, segredos por variáveis de ambiente, SQL parametrizado via sqlc, timeouts e desligamento graceful.
  5. Convenções de documentação: prosa em português, identificadores e caminhos em inglês; documentar o estado real do código e registrar divergências sem corrigi-las silenciosamente.
  6. Revisão da constituição: mudanças de arquitetura ou segurança exigem revisar e atualizar CONSTITUTION.md na mesma change.
