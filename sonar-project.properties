sonar.projectKey=my_screening_app
sonar.projectName=my_screening_app
sonar.projectVersion=1.0

# O scanner recebe SONAR_HOST_URL e SONAR_TOKEN pelo ambiente:
# localmente via .env (docker compose) e no CI via variáveis/secret.
# Não versione token aqui.

sonar.sources=.
sonar.tests=internal
sonar.test.inclusions=**/*_test.go
sonar.sourceEncoding=UTF-8

# Reduz o heap do Node do analisador JS/CSS (evita crash em Docker/emulação).
sonar.javascript.node.maxspace=1024

# Fora do escopo: dependências, código gerado, artefatos de relatório e coverage.
sonar.exclusions=**/vendor/**,**/*.pb.go,reports/**,**/reports/**,internal/db/sqlc/**,coverage.out,.scannerwork/**,bin/**,**/.DS_Store,internal/web/templates/**,internal/web/static/**

# Caminho do relatório de cobertura gerado por `go test -coverprofile=coverage.out`.
sonar.go.coverage.reportPaths=coverage.out

# O quality gate bloqueante é habilitado no CI com -Dsonar.qualitygate.wait=true.
