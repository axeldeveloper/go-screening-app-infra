sonar.projectKey=my_screening_app
sonar.projectName=Meu Projeto Go
sonar.projectVersion=1.0

# Onde está o código-fonte
sonar.sources=.
# Ignora arquivos de teste na contagem de código duplicado/complexidade (mas ainda os usa para coverage)
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/vendor/**,**/*.pb.go

# Caminho do relatório de cobertura gerado pelo `go test`
sonar.go.coverage.reportPaths=coverage.out

# (Opcional) Caminho para relatórios do go vet ou golangci-lint
# sonar.go.govet.reportPaths=govet.out
# sonar.go.golangci-lint.reportPaths=lint.xml