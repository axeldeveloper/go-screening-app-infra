services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:pg766312@db:5432/my_screening_app?sslmode=disable
    restart: on-failure
    depends_on:
      db:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  migrate:
    build: .
    entrypoint: ["/usr/local/bin/migrate", "-path", "/migrations", "-database", "postgres://postgres:pg766312@db:5432/my_screening_app?sslmode=disable", "up"]
    restart: on-failure
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pg766312
      POSTGRES_DB: my_screening_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
